[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-trading-starter"
version = "0.2.0"
description = "AI trading system with ensemble strategies, walk-forward validation, and realistic backtesting"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "alpaca-py>=0.30.0",
  "pandas>=2.0.0",
  "Jinja2>=3.1.0",
  "numpy>=1.24.0",
  "yfinance>=0.2.40",
  "scikit-learn>=1.3.0",
  "scipy>=1.10.0",
  "pyarrow>=14.0.0",
  "matplotlib>=3.7.0",
  "joblib>=1.3.0",
  "vaderSentiment>=3.3.2",
  "streamlit>=1.30.0",
  "robin-stocks>=3.4.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-cov>=4.1"]

[tool.setuptools.packages.find]
include = ["ai_trading*"]
