[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-trading-starter"
version = "0.1.0"
description = "Educational, paper-trading-only AI trading starter"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "alpaca-py>=0.30.0",
  "pandas>=2.0.0",
  "yfinance>=0.2.40",
  "scikit-learn>=1.3.0",
  "joblib>=1.3.0",
]

[tool.setuptools.packages.find]
include = ["ai_trading*"]
