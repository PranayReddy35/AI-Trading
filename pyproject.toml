[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-trading-starter"
version = "0.2.0"
description = "AI trading system with ensemble strategies, walk-forward validation, and realistic backtesting"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "alpaca-py>=0.30.0",
  "pandas>=2.0.0",
  "numpy>=1.24.0",
  "yfinance>=0.2.40",
  "scikit-learn>=1.3.0",
  "joblib>=1.3.0",
  "vaderSentiment>=3.3.2",
]

[tool.setuptools.packages.find]
include = ["ai_trading*"]
